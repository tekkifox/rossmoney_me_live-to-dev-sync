name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/tekkifox/rossmoney_me_live-to-dev-sync
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: |
          echo "image digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### Image digest"
            echo
            echo "\`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test image
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/tekkifox/rossmoney_me_live-to-dev-sync:latest
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" sh -c \
            'command -v curl; curl --version | head -n 1'
          docker run --rm "$IMAGE" sh -c \
            'curl --version | head -n 1 | grep -q "^curl 8\.10\.1"'
          W=/var/lib/rosso-dev-sync/work
          L=/var/log/rosso-dev-sync
          docker run --rm "$IMAGE" sh -c \
            'stat -c "%U:%G:%a" "$1" | grep -qx "root:root:755"' _ "$W"
          docker run --rm "$IMAGE" sh -c \
            'stat -c "%U:%G:%a" "$1" | grep -qx "root:root:755"' _ "$L"
          docker run --rm "$IMAGE" mongosh --version
          docker run --rm "$IMAGE" mongoimport --version
          URL=https://www.rossmoney.me/
          code=$(docker run --rm "$IMAGE" sh -c \
            'curl -fsSL -o /dev/null -w "%{http_code}" "$1"' _ "$URL")
          echo "anonymous HTTPS health check: HTTP $code"
          [ "$code" = 200 ]

  deploy:
    name: Deploy the dev sync
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-dev-sync-${{ github.run_id }}
      - name: Ask the fleet deploy seat to deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SEAT_HOST: ${{ secrets.DEPLOY_SEAT_HOST }}
          TARGET_HOST: paseo
          TARGET_STACKS: paseo-rosso-dev-sync
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy"
          chmod 0600 "$HOME/.ssh/deploy"
          ssh -i "$HOME/.ssh/deploy" -p 32 \
            -o BatchMode=yes -o StrictHostKeyChecking=accept-new \
            root@"$DEPLOY_SEAT_HOST" \
            "fleet-deploy $TARGET_HOST $TARGET_STACKS deploy"
