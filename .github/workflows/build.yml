name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/tekkifox/rossmoney_me_live-to-dev-sync
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report digest
        run: |
          echo "image digest: ${{ steps.build.outputs.digest }}"
          {
            echo "### Image digest"
            echo
            echo "\`${{ steps.build.outputs.digest }}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test image
        run: |
          set -euo pipefail
          IMAGE=ghcr.io/tekkifox/rossmoney_me_live-to-dev-sync:latest
          docker pull "$IMAGE"
          docker run --rm "$IMAGE" sh -c \
            'command -v curl; curl --version | head -n 1'
          docker run --rm "$IMAGE" sh -c \
            'curl --version | head -n 1 | grep -q "^curl 8\.10\.1"'
          W=/var/lib/rosso-dev-sync/work
          L=/var/log/rosso-dev-sync
          docker run --rm "$IMAGE" sh -c \
            'stat -c "%U:%G:%a" "$1" | grep -qx "root:root:755"' _ "$W"
          docker run --rm "$IMAGE" sh -c \
            'stat -c "%U:%G:%a" "$1" | grep -qx "root:root:755"' _ "$L"
          docker run --rm "$IMAGE" mongosh --version
          docker run --rm "$IMAGE" mongoimport --version
          URL=https://www.rossmoney.me/
          code=$(docker run --rm "$IMAGE" sh -c \
            'curl -fsSL -o /dev/null -w "%{http_code}" "$1"' _ "$URL")
          echo "anonymous HTTPS health check: HTTP $code"
          [ "$code" = 200 ]

  # The fleet's stacks are Ansible-managed files on disk. This job asks the
  # deploy gateway to pull and recreate the stack over SSH from a GitHub-hosted
  # runner that has joined the tailnet; the gateway validates the host and
  # stacks and refuses a stack the host does not declare.
  #
  # This is deliberately self-contained rather than a call to the fleet's
  # reusable deploy-stack.yml: that workflow lives in the private
  # tekkifox/infrastructure-as-code repository, and GitHub does not let a public
  # repository call a reusable workflow in a private one. The duplicated lines
  # here are only transport, and the price of this repository being public.
  deploy:
    name: Deploy the dev sync
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: gh-dev-sync-${{ github.run_id }}
      - name: Install the gateway key and its pinned host key
        env:
          GATEWAY_KEY: ${{ secrets.DEPLOY_GATEWAY_SSH_KEY }}
          GATEWAY_HOST_KEY: ${{ secrets.DEPLOY_GATEWAY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$HOME/.ssh"
          printf '%s\n' "$GATEWAY_KEY" > "$HOME/.ssh/gateway"
          chmod 0600 "$HOME/.ssh/gateway"
          printf '%s\n' "$GATEWAY_HOST_KEY" > "$HOME/.ssh/gateway_known_hosts"
          chmod 0600 "$HOME/.ssh/gateway_known_hosts"

      - name: Ask the deploy gateway to deploy
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/gateway" \
            -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/gateway_known_hosts" \
            -o ConnectTimeout=30 \
            deploy-hop@deploy-gateway.tail81cbd2.ts.net \
            "deploy paseo paseo-rosso-dev-sync"
